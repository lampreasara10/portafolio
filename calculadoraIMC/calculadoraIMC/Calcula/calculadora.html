<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Calcula y clasifica tu índice de masa corporal</h1>

    <div class="contenedor">
        <h2>Aquí ingresarás tu peso y altura</h2>

        <input type="number" id="peso" placeholder="Peso en kg">

        <input type="number" id="altura" placeholder="Altura en metros">

        <button onclick="Calcular()">Calcular</button>

        <div id="resultado"></div>
    </div>

    <script>
        function Calcular() {

            const peso = parseFloat(
                document.getElementById("peso").value
            );

            const altura = parseFloat(
                document.getElementById("altura").value
            );

                        if (isNaN(peso) || isNaN(altura) || peso <= 0 || altura <= 0) {
                document.getElementById("resultado").innerHTML = "Ingresa un peso y una altura válidos.";
                return;
            }

            const imc = peso / (altura * altura);

            let clasificacion;

            if (imc < 18.5) {
                clasificacion = "Bajo peso";
                recomendacion = "Se recomienda aumentar el consumo de alimentos saludables y consultar a un nutricionista.";
            } else if (imc < 25) {
                clasificacion = "Peso normal";
                recomendacion = "¡Excelente! Mantén una alimentación balanceada y realiza actividad física regularmente.";
            } else if (imc < 30) {
                clasificacion = "Sobrepeso";
                recomendacion = "Se recomienda mejorar la alimentación, hacer ejercicio y reducir el consumo de alimentos ultraprocesados.";
            } else {
                clasificacion = "Obesidad";
                 recomendacion = "Es importante acudir a un profesional de la salud para recibir orientación y adoptar hábitos saludables.";
            }

            document.getElementById("resultado").innerHTML =
    "Tu IMC es: " + imc.toFixed(2) + "<br>" +
    "Clasificación: " + clasificacion + "<br>" +
    "Recomendación: " + recomendacion;


        }
    </script>

</body>
</html>
